services:
  sherwood-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID:-53173}
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL:-https://mainnet.robinhoodchain.com}
      - NEXT_PUBLIC_EXPLORER_URL=${NEXT_PUBLIC_EXPLORER_URL:-https://explorer.robinhoodchain.com}
      - NEXT_PUBLIC_PACK_MANAGER_ADDRESS=${NEXT_PUBLIC_PACK_MANAGER_ADDRESS:-0x0000000000000000000000000000000000000000}
      - NEXT_PUBLIC_BUYBACK_VAULT_ADDRESS=${NEXT_PUBLIC_BUYBACK_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}
      - NEXT_PUBLIC_TREASURY_ADDRESS=${NEXT_PUBLIC_TREASURY_ADDRESS:-0x0000000000000000000000000000000000000000}
      - NEXT_PUBLIC_USDG_ADDRESS=${NEXT_PUBLIC_USDG_ADDRESS:-0x0000000000000000000000000000000000000000}
      - NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID=${NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID:-}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - sherwood-web
